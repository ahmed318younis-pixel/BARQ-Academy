name: BARQ Academy CI

on:
  push:
  pull_request:

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  compose-validation:
    name: Docker Compose validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create CI environment
        run: |
          CI_DB_PASSWORD="$(openssl rand -hex 16)"
          echo "POSTGRES_PASSWORD=${CI_DB_PASSWORD}" > .env
          echo "PUBLIC_PORT=8090" >> .env

          mkdir -p config
          cat > config/app.env <<ENV
          DATABASE_URL=postgresql://barq_app:${CI_DB_PASSWORD}@postgres:5432/barq_tasks
          REDIS_URL=redis://redis:6379/0
          ENV

      - name: Validate Compose configuration
        run: docker compose config

      - name: Build images
        run: docker compose build

      - name: Start services
        run: docker compose up -d

      - name: Wait for readiness
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://localhost:8090/ready >/dev/null; then
              echo "Application is ready."
              exit 0
            fi
            sleep 2
          done

          echo "Application did not become ready."
          docker compose ps
          docker compose logs --no-color
          exit 1

      - name: Run validation
        run: python3 validate.py

      - name: Show service status
        if: always()
        run: docker compose ps

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Cleanup
        if: always()
        run: docker compose down -v
